<div class="container-fluid">
  <table class="table">
    <thead class="thead-light">
      <tr>
        <th>SN</th>
        <th *ngFor="let heading of headings">{{ heading }}</th>
        <th class="text-center">Action</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor=" let data of tableData | paginate: { itemsPerPage: itemsPerPage, currentPage: page }; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ data.OrderNo }}</td>
        <td>{{ data.AttributeName }}</td>
        <td>{{ data.DataType }}</td>
        <td>{{ data.ParentAttribute }}</td>
        <td>{{ data.ConstraintMode }}</td>
        <td>{{ data.IsRequired }}</td>
        <td>{{ data.UseAsBarcode }}</td>
        <td>
          <button class="btn" (click)="onEdit(data)">
            <i class="bi bi-pencil-square edit-btn"></i>
          </button>
          <button class="btn border-4" (click)="onDelete(data)">
            <i class="bi bi-trash3 delete-btn"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <pagination-controls
    (pageChange)="page = $event"
    class="text-center"
  ></pagination-controls>
</div>
