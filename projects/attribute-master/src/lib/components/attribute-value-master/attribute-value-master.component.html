<div class="container-fluid">
    <lib-header title="Attributes Value Master"></lib-header>
    <!-- form section -->
    <form action="" [formGroup]="attributeValueForm" class="px-3">
        <div class="form-row border-4 border-bottom border-bottom-light px-3 py-3">
            <div class="col-md-4 col-12 mr-4">
                <div class="row">
                    <div class="col-5 d-flex align-items-center">
                        <label class="m-0">Attributes Types <span class="text-danger"> * </span>:</label>
                    </div>
                    <div class="col-7">
                        <select
                            name="attributetype"
                            class="form-control"
                            formControlName="AttributeType"
                        >
                            <option value="" disabled>Select Attributes Types</option>
                            <option *ngFor="let type of attributeTypes" [value]="type.AttributeTypeID" >{{ type.AttributeType }}</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-md-4 col-12" *ngIf="attributeValueForm.get('AttributeType')?.value != 'Transaction'">
                <div class="row">
                    <div class="col-5 d-flex align-items-center">
                        <label class="m-0">Apply To <span class="text-danger"> * </span>:</label>
                    </div>
                    <div class="col-7">
                        <select
                            name="attributetype"
                            class="form-control"
                            formControlName="ApplyTo"
                        >
                            <option value="" disabled>Select Apply To</option>
                            <option *ngFor="let apply of applysTo" [value]="apply.ApplyToID" >{{apply.ApplyTo}}</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="form-row border-4  px-3 py-3">
            <div class="col-md-4 col-12 mr-4">
                <div class="row">
                    <div class="col-5 d-flex align-items-center">
                        <label class="m-0">Attributes Name <span class="text-danger"> * </span>:</label>
                    </div>
                    <div class="col-7">
                        <select
                            name="attributetype"
                            class="form-control"
                            formControlName="AttributeName"
                        >
                            <option value="" disabled>Select Attributes Names</option>
                            <option *ngFor="let attname of attributeNames" [ngValue]="attname" >{{ attname.attributeName }} </option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-md-4 col-12" *ngIf="this.hasParent">
                <div class="row">
                    <div class="col-5 d-flex align-items-center">
                        <label class="m-0">Parent Attributes: </label>
                    </div>
                    <div class="col-7 ">
                       <p class="m-0"><b>{{this.parentName}}</b></p>
                    </div>
                </div>
            </div>
        </div>
        <div class="form-row border-4  px-3 mb-3">
            <div class="col-md-4 col-12">
                <div class="row">
                    <div class="col-5 d-flex align-items-center">
                        <label class="m-0">Attribute Value <span class="text-danger"> * </span>:</label>
                    </div>
                    <div class="col-7 ">
                        <input type="text" class="form-control" formControlName="AttributeValue" >
                    </div>
                </div>
            </div>
             <div class="col-md-4 col-12 ml-4" *ngIf="this.hasParent">
                <div class="row">
                    <div class="col-5 d-flex align-items-center">
                        <label class="m-0">Parent Attributes Value <span class="text-danger"> * </span></label>
                    </div>
                    <div class="col-7">
                        <select
                            name="attributetype"
                            class="form-control"
                            formControlName="ParentAttributeValue">
                            <option value="" disabled>Select Parent Attributes Value</option>
                            <option *ngFor="let parentValue of parentValueList" [ngValue]="parentValue" >{{ parentValue.AttributeValue }}</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-12">
                <button class="btn button" type="submit" [disabled]="attributeValueForm.invalid" (click)="AddAttribute()" >{{ isEdit ? 'Update' : 'Add' }}</button>
            </div>
        </div>
       
    </form>
    <!-- table section -->
    <ng-container>
        <div class="row px-4">
            <div class="col-12">
                <p class="mt-2">Attribute Value List:</p>
                 <table class="table">
                    <thead class="thead-light">
                    <tr>
                        <th>SN</th>
                        <th>Attributes Name</th>
                        <th>Attributes Value</th>
                        <th>Parent Attributes</th>
                        <th>Parent Attributes Value</th>
                        <th class="text-center">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let b of this.attributeValueList | paginate: { itemsPerPage: itemsPerPage, currentPage: page };let i=index">
                            <td>{{i}}</td>
                            <td>{{b.AttributeName || '-'}}
                            <td>{{b.AttributeValue || '-' }}</td>
                            <td>{{b.ParentAttributeName || '-' }}</td>
                            <td>{{b.ParentAttributeValueName || '-' }}</td>
                            <td class="text-center">
                                <button class="action-btn" (click) ="editAttribute(i)">
                                    <i class="bi bi-pencil-square edit-btn"></i>
                                </button>
                                <button class="action-btn" (click) ="deleteAttribute(i)">
                                    <i class="bi bi-trash3 delete-btn"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <pagination-controls (pageChange)="page = $event" class="text-center">
                </pagination-controls>
            </div>
        </div>
    </ng-container>
</div>
