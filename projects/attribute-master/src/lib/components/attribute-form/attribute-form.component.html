<div class="container-fluid">
  <lib-header title="Attributes Master"></lib-header>
  <form action="" [formGroup]="attributeForm" (ngSubmit)="onSubmit()">
    <!-- Top Row -->
    <div class="form-row border-4 border-bottom border-light p-3 mb-2">
      <div class="col-6 col-md-3">
        <div class="d-flex justify-content-between">
          <label>Attributes Types <span class="text-danger"> * </span></label>
          <select
            name="attributetype"
            class="form-control"
            formControlName="AttributeType"
          >
            <option value="">--Select--</option>
            <option *ngFor="let attribute of attributeTypes" [value]="attribute.AttributeTypeID" >{{ attribute.AttributeType }}</option>
          </select>
        </div>
      </div>
      <div class="col-md-3 col-6">
        <div class="d-flex px-2 justify-content-between">
          <label>Apply To <span class="text-danger"> * </span></label>
          <select name="applyto" class="form-control" formControlName="ApplyTo">
            <option value="">--Select--</option>
            <option *ngFor="let data of applyTo" [value]="data.ApplyToID">
              {{ data.ApplyTo }}
            </option>
          </select>
        </div>
      </div>
      <div class="col-md-3 col-6">
        <div class="d-flex px-2 align-items-center h-100">
          <div class="custom-control custom-checkbox">
            <input
              type="checkbox"
              name=""
              id="mappingrequired"
              class="custom-control-input"
              formControlName="IsMappingRequired"
              [disabled]="this.attributeForm.get('AttributeType')?.value == 'Document'"
            />
            <label for="mappingrequired" class="custom-control-label">Attributes Mapping Required</label>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-6">
        <div class="d-flex px-2 justify-content-between">
          <span>Attributes Mapped by</span>
          <select name="" id="" class="form-control" formControlName="MappedBy">
            <option value="">--Select--</option>
            <option [value]="mappedBy.MappingID" *ngFor="let mappedBy of attributesMappedBy">{{ mappedBy.MappedBy }}</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Second Row -->
    <div class="form-row p-2">
      <div class="col-md-3 col-6">
        <div class="d-flex px-2 justify-content-between">
          <label for="">Attribute Name <span class="text-danger"> * </span></label >
          <input type="text" class="form-control" formControlName="FieldName" />
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="d-flex px-2 justify-content-between">
          <label for="">Input Type <span class="text-danger"> * </span></label>
          <select name="" id="" class="form-control" formControlName="DataType">
            <option value="">--Select--</option>
            <option value="number">Number</option>
            <option value="text">Text</option>
            <option value="list">List</option>
          </select>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="d-flex px-2 justify-content-evenly">
          <label for="orderno">Serial Order No <span class="text-danger"> * </span></label>
          <input
            type="number"
            class="form-control"
            formControlName="OrderNo"
            id="orderno"
            oninput="this.value = this.value.replace(/\D/g, '')"
          />
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="d-flex px-2 justify-content-between">
          <label for="regex">Regex Format</label>
          <input type="text" class="form-control" formControlName="Regex" id="regex"/>
        </div>
      </div>
    </div>

    <!-- Third Row -->
    <div class="form-row p-3 border-bottom border-3 border-light align-items-center">
      <div class="col-6 col-md-3">
        <div class="d-flex justify-content-start">
          <span class="col-2"></span>
          <div class="custom-control custom-checkbox">
            <input
              type="checkbox"
              name=""
              id="parentattributes"
              class="custom-control-input"
              formControlName="HasParent"
            />
            <label for="parentattributes" class="custom-control-label">Has Parent Attribbutes</label>
          </div>
        </div>
      </div>

      <div class="col-6 col-md-3">
        <div class="d-flex px-2 justify-content-start">
          <span class="col-2"></span>
          <div class="custom-control custom-checkbox">
            <input
              type="checkbox"
              name=""
              id="uniqueconstraint"
              class="custom-control-input"
              formControlName="CheckUniqueConstraint"
            />
            <label for="uniqueconstraint" class="custom-control-label">Check Unique Constraint</label>
          </div>
        </div>
      </div>
      <div class="col-3"></div>
      <div class="col-3"></div>
    </div>

    <div class="form-row p-2 border-3 border-bottom border-light align-items-center">
      <div class="col-6 col-md-3">
        <div class="d-flex px-2 align-items-center">
          <label for="">Parent Attributes</label>
          <select
            name=""
            id=""
            class="form-control"
            formControlName="ParentField"
          >
            <option value="">--Select Parent Attributes--</option>
            <option *ngFor="let attribute of parentAttributes"[value]="attribute.FieldName">{{ attribute.FieldName }}</option>
          </select>
        </div>
      </div>

      <div class="col-6 col-md-3">
        <div class="d-flex justify-content-between">
          <span class="col-2"></span>
          <select name="" id="" class="form-control" formControlName="ConstraintMode">
            <option value="">--Select Constraint Mode--</option>
            <option value="itemwise">Unique per Item</option>
            <option value="global">Global Unique</option>
          </select>
        </div>
      </div>

      <div class="col-6 col-md-3">
        <div class="d-flex px-2 align-items-center h-100">
          <div class="custom-control custom-checkbox">
            <input
              type="checkbox"
              name=""
              id="mandatoryInput"
              class="custom-control-input"
              formControlName="IsRequired"
            />
            <label for="mandatoryInput" class="custom-control-label">Is Mandatory Input</label >
          </div>
        </div>
      </div>

      <div class="col-6 col-md-3">
        <div class="d-flex justify-content-between px-2">
          <div class="d-flex custom-control custom-checkbox justify-content-between align-items-center" >
            <input
              type="checkbox"
              name=""
              id="useAsBarcode"
              class="custom-control-input"
              formControlName="UseAsBarcode"
            />
            <label for="useAsBarcode" class="custom-control-label">Use as Barcode</label>
          </div>

          <div>
            <button class="btn button" type="submit">{{ isEdit ? "Update" : "Add" }}</button>
          </div>
        </div>
      </div>
    </div>
  </form>

  <ng-container *ngIf="attributeMasterService.attributeMasterObj.AttributeDetails.length > 0">
    <lib-attribute-table></lib-attribute-table>
  </ng-container>
</div>
